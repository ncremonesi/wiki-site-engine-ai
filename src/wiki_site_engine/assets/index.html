<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{HTML_TITLE}}</title>
<meta name="theme-color" content="{{THEME_COLOR}}">
<link rel="icon" type="image/png" href="favicon.png?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<script src="vis-network.min.js"></script>
</head>
<body>
  <header id="topbar">
    <button id="brand-home" type="button" title="Torna alla home">
      <img id="brand-mark" src="{{LOGO}}" alt="">
      <span id="brand-text">
        <h1>{{SITE_TITLE}}</h1>
        <span id="brand-subtitle">{{SITE_SUBTITLE}}</span>
      </span>
    </button>
    <form id="search-form">
      <div id="search-wrap">
        <input id="search" type="text" placeholder="Cerca pagina, tag...">
        <button id="search-clear" type="button" title="Svuota ricerca">&times;</button>
        <button id="search-body-toggle" class="active" type="button" aria-pressed="true" title="Ricerca nel testo attiva: premi per limitarla a titoli e metadati">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="14" y2="6"/><line x1="3" y1="11" x2="11" y2="11"/><line x1="3" y1="16" x2="9" y2="16"/><circle cx="17" cy="16" r="4"/><line x1="20" y1="19" x2="22.5" y2="21.5"/></svg>
        </button>
      </div>
      <button id="search-btn" type="submit">Cerca</button>
    </form>
    <button id="list-toggle" type="button" title="Grafo">&#128312;</button>
    <span id="stats"></span>
  </header>

  <main>
    <aside id="list-panel" class="list-open">
      <div id="filters-section">
        <div class="filter-label filters-heading">Filtri</div>
        <details class="cat-group" id="percorsi-section">
          <summary>Percorsi<span class="li-cat" id="percorsi-count"></span></summary>
          <div id="percorsi-list"></div>
        </details>
        <div id="category-filter"></div>
      </div>
      <div class="results-heading">Risultati</div>
      <div id="list-count"></div>
      <ul id="list-results"></ul>
    </aside>
    <div id="graph-wrap">
      <div id="graph"></div>
      <div id="graph-loading">Generazione grafo&hellip;</div>
      <button id="graph-reset" title="Reset vista">&#10227;</button>
      <div id="legend"></div>
      <div id="graph-signature"><img src="{{LOGO}}" alt=""></div>
      <div id="graph-tooltip" class="hidden"></div>
      <div id="node-actions" class="hidden">
        <button id="node-video-btn" class="hidden" type="button">&#9654; Guarda video</button>
        <button id="node-open-btn" type="button">Apri pagina &rarr;</button>
      </div>
    </div>
  </main>

  <div id="panel-backdrop" class="hidden"></div>
  <aside id="panel" class="hidden">
    <div id="panel-toolbar">
      <button id="panel-back" class="nav-hidden" title="Nota precedente">&larr;</button>
      <button id="panel-forward" class="nav-hidden" title="Nota successiva">&rarr;</button>
      <button id="panel-copy" title="Copia link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></button>
      <button id="panel-print" title="Stampa pagina"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg></button>
      <button id="panel-toc-btn" class="hidden" title="Indice sezioni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
      <button id="panel-close">&times;</button>
    </div>
    <div class="print-header">
      <img src="{{LOGO}}" alt="">
      <div>
        <strong>{{SITE_TITLE}}</strong>
        <span>{{SITE_SUBTITLE}}</span>
      </div>
    </div>
    <div id="panel-meta"></div>
    <div id="panel-body"></div>
  </aside>

  <nav id="panel-toc" class="hidden" aria-label="Indice sezioni"></nav>

  <script src="app-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
