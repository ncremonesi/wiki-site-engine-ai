[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wiki-site-engine"
version = "0.1.0"
description = "Static site data engine for linked Markdown wikis"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wiki_site_engine = ["assets/*"]

